<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>와방 | 공인중개사 이하늘 - 자동 매물 접수 챗봇</title>

  <!-- Pretendard 폰트 & Tailwind CSS & Phosphor Icons -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
            colors: {
              brand: {
                50: '#F0F9FF',
                100: '#E0F2FE',
                200: '#BAE6FD',
                500: '#0EA5E9',
                600: '#0284C7',
                700: '#0369A1',
              }
            }
          }
        }
      };
    }
  </script>

  <style>
    html {
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      font-size: clamp(14px, 3.9vw, 16px); /* 폰 폭에 맞춰 전체 크기 자동 조절 */
    }
    /* 아이폰은 입력창 글자가 16px 미만이면 화면이 확대되어 잘려 보이므로 고정 */
    #userInput { font-size: 16px !important; }
    /* 화면 높이: 구형 브라우저(100vh) → dvh → JS로 실제 보이는 높이(키보드 포함)로 갱신 */
    :root { --app-h: 100vh; }
    @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
    html, body { height: 100%; }
    .app-h { height: var(--app-h); min-height: -webkit-fill-available; }
    body {
      background-color: #E2EEF8;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg-anim {
      animation: popIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .typing-dot {
      animation: bounceDot 1.2s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  </style>
</head>
<body class="app-h flex justify-center overflow-hidden">

  <!-- ================= 설정 영역 ================= -->
  <script>
    const CONFIG = {
      PHONE: "010-4445-6432",                                   // 중개사 휴대폰 번호
      KAKAO_OPENCHAT_URL: "https://open.kakao.com/o/sPQtqVTi",   // 오픈카카오톡 1:1 채팅 링크
      INSTAGRAM_DM_URL: "https://www.instagram.com/_u/bu_room/", // 인스타 앱의 @bu_room 프로필로 바로 열기 (프로필에서 '메시지')
      INSTAGRAM_WEB_URL: "https://www.instagram.com/bu_room/",      // 컴퓨터(앱 없음)에서 열 일반 프로필 주소
      LISTING_SITE_URL: "https://bu-room.github.io/siteandchat/" // 와방 매물 보는 사이트 주소
    };
  </script>
  <!-- ============================================== -->

  <!-- 모바일 퍼스트 중앙 컨테이너 -->
  <div class="w-full max-w-md app-h bg-[#F4FAFF] shadow-2xl border-x border-sky-100 flex flex-col relative overflow-hidden">

    <!-- 상단 고정 헤더 -->
    <header class="shrink-0 bg-white/95 backdrop-blur-md border-b border-sky-100 z-20" style="padding-top: env(safe-area-inset-top);">
      <div class="px-3 min-[380px]:px-4 h-16 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <div class="w-10 h-10 rounded-2xl bg-[#0284C7] flex items-center justify-center shrink-0 shadow-sm">
            <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
              <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
            </svg>
          </div>
          <div class="leading-tight min-w-0 flex-1">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-base font-extrabold text-slate-900 shrink-0">와방</span>
            </div>
            <div class="text-[11px] font-medium text-sky-700 truncate">공인중개사 이하늘 · 매물 접수 챗봇</div>
          </div>
        </div>

        <div class="flex items-center gap-1 shrink-0">
          <button type="button" onclick="restartChat()" title="처음부터 다시하기"
            class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-white hover:bg-sky-50 text-sky-800 border border-sky-300 text-[11px] font-bold shadow-sm transition">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v5h5" />
            </svg>
            <span class="max-[359px]:hidden">초기화</span>
          </button>
          <a id="headerListingLink" href="https://bu-room.github.io/siteandchat/"
            class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-[#0284C7] hover:bg-sky-700 text-white text-[11px] font-bold shadow-sm transition">
            <i class="ph-fill ph-house-line text-xs"></i>
            <span class="max-[359px]:hidden">매물보기</span>
          </a>
        </div>
      </div>

      <!-- 진행률 표시 바 -->
      <div class="px-4 pb-2.5 bg-white/95">
        <div class="flex items-center justify-between text-[11px] font-semibold text-slate-400 mb-1">
          <span id="progressLabel">맞춤 매물 조건 접수 준비</span>
          <span id="progressCount" class="text-[#0284C7] font-bold">0 / 11</span>
        </div>
        <div class="w-full h-1.5 bg-sky-100 rounded-full overflow-hidden">
          <div id="progressBar" class="h-full bg-[#0284C7] rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>
    </header>

    <!-- 중앙 채팅 대화 영역 -->
    <main id="chatScrollArea" class="flex-1 overflow-y-auto px-4 py-5 space-y-4">
      <div id="chatContainer" class="space-y-4 pb-10"></div>
    </main>

    <!-- 하단 빠른 선택 칩 & 텍스트 입력 바 -->
    <footer id="inputArea" class="shrink-0 bg-white border-t border-sky-100 z-20" style="padding-bottom: env(safe-area-inset-bottom);">
      <div class="px-4 py-3 space-y-2.5">
        <div id="quickChipsContainer" class="flex flex-wrap gap-1.5 max-h-[30vh] overflow-y-auto no-scrollbar"></div>

        <div id="multiSelectBar" class="hidden flex items-center justify-between bg-sky-50 px-3 py-2 rounded-xl border border-sky-200">
          <span id="multiSelectCount" class="text-xs font-bold text-[#0284C7]">0개 선택됨</span>
          <button type="button" onclick="confirmMultiSelect()"
            class="px-3.5 py-1.5 rounded-lg bg-[#0284C7] text-white text-xs font-bold shadow-sm hover:bg-sky-700 transition">
            선택 완료 <i class="ph-bold ph-check ml-0.5"></i>
          </button>
        </div>

        <form id="chatForm" onsubmit="handleFormSubmit(event)" class="flex items-center gap-2">
          <button type="button" id="prevStepBtn" onclick="goPrevStep()" title="이전 질문으로"
            class="hidden shrink-0 w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition">
            <i class="ph-bold ph-arrow-u-up-left text-base"></i>
          </button>
          <input id="userInput" type="text" autocomplete="off" placeholder="답변을 입력하거나 위 버튼을 눌러주세요..."
            class="flex-1 min-w-0 px-4 py-2.5 rounded-2xl bg-sky-50/80 border border-sky-200 text-base text-slate-800 placeholder-slate-400 focus:outline-none focus:border-[#0284C7] focus:bg-white transition" />
          <button type="submit"
            class="shrink-0 w-10 h-10 rounded-2xl bg-[#0284C7] hover:bg-sky-700 active:scale-95 text-white flex items-center justify-center shadow-sm transition">
            <i class="ph-fill ph-paper-plane-right text-base"></i>
          </button>
        </form>
      </div>
    </footer>

    <!-- 상단 토스트 알림 메시지 -->
    <div id="toast" class="absolute top-24 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2.5 rounded-2xl bg-slate-900/95 text-white text-xs font-bold shadow-lg flex items-center gap-1.5 w-max max-w-[90%]">
      <i class="ph-fill ph-check-circle text-emerald-400 text-base shrink-0"></i>
      <span id="toastText" class="leading-snug">복사되었습니다!</span>
    </div>

    <!-- 전송 후 후속 행동 선택 모달 -->
    <div id="afterSendModal" class="absolute inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
      <div class="bg-white rounded-3xl max-w-sm w-full max-h-full overflow-y-auto p-5 space-y-4 shadow-2xl msg-anim border border-sky-100">
        <div class="text-center space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-sky-50 text-[#0284C7] flex items-center justify-center mx-auto text-2xl shadow-sm">
            <i class="ph-fill ph-paper-plane-tilt"></i>
          </div>
          <h3 id="modalTitle" class="text-base font-extrabold text-slate-900">문의 내용이 복사되었습니다!</h3>
          <p id="modalDesc" class="text-xs text-slate-500 leading-relaxed">
            열린 채팅창에 <b>붙여넣기(길게 누르기 → 붙여넣기)</b> 후 전송해 주세요.<br/>
            전송을 마치셨다면 아래에서 다음 단계를 선택해 주세요!
          </p>
        </div>

        <div class="text-center">
          <button type="button" onclick="hideAfterSendModal()" class="text-[11px] text-slate-400 hover:text-slate-600 underline">
            요약 화면으로 돌아가기
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ================= 챗봇 질문 시나리오 (11단계) =================
    const STEPS = [
      {
        key: "structure",
        label: "구조",
        question: "먼저, 어떤 <b>구조(방 개수)</b>의 집을 찾고 계신가요? 🏠",
        placeholder: "예: 원룸, 투룸, 복층 오피스텔 등 직접 입력",
        chips: ["원룸", "투룸", "쓰리룸", "오피스텔", "아파트", "상가"]
      },
      {
        key: "moveInDate",
        label: "입주예정일",
        question: "희망하시는 <b>입주예정일</b>은 언제쯤인가요? 📅",
        placeholder: "예: 12월 중순, 즉시 입주 등 직접 입력",
        chips: ["즉시 입주", "1개월 이내", "2~3개월 후", "날짜 협의 가능"]
      },
      {
        key: "deposit",
        label: "보증금",
        question: "생각해 두신 <b>보증금</b> 예산은 어느 정도인가요? 💰",
        placeholder: "예: 2,000만원, 5,000만원 등 직접 입력",
        chips: ["500만원", "1,000만원", "3,000만원", "5,000만원", "1억 이상"]
      },
      {
        key: "monthlyRent",
        label: "월세",
        question: "희망하시는 <b>월세(또는 전세·매매 예산)</b> 범위를 알려주세요!",
        placeholder: "예: 월세 60만원 이하, 전세 2억대 등",
        chips: ["전세/매매 희망", "50만원 이하", "50~80만원", "80~120만원", "120만원 이상"]
      },
      {
        key: "adminFee",
        label: "관리비(포함/별도)",
        question: "<b>관리비(포함 또는 별도 여부)</b>에 대해 선호하시는 조건이 있나요?",
        placeholder: "예: 관리비 포함 70 이하, 별도 10만 이하 등",
        chips: ["관리비 포함 희망", "별도 무관 (10만 이하)", "상관없음"]
      },
      {
        key: "location",
        label: "찾으시는 위치",
        question: "<b>찾으시는 위치(지역/역세권)</b>를 알려주세요! 📍",
        placeholder: "예: 역삼역 도보 10분 이내, 수지구청역 인근 등",
        chips: ["지하철 역세권 도보 10분 이내", "조용한 주택가/공원 인근", "직장·학교 근처 (지역 직접입력)"]
      },
      {
        key: "parking",
        label: "주차 여부",
        question: "<b>주차 여부</b>와 차량 종류(승용 or SUV)를 알려주세요! 🚗",
        placeholder: "예: 주차 1대 필수 (SUV), 주차 불필요 등",
        chips: ["주차 불필요", "필요 (승용차)", "필요 (SUV/대형)", "경차"]
      },
      {
        key: "pet",
        label: "반려동물 여부",
        question: "함께 거주할 <b>반려동물 여부</b>를 알려주세요! 🐾",
        placeholder: "예: 소형견 1마리, 고양이 2마리, 없음 등",
        chips: ["없음", "강아지 1마리", "고양이 1마리", "기타 / 다견·다묘"]
      },
      {
        key: "options",
        label: "원하시는 옵션",
        question: "<b>원하시는 옵션</b>을 모두 골라주시거나 직접 적어주세요! ✨\n<span class='text-xs text-slate-400 font-normal'>(여러 개 선택 후 '선택 완료'를 눌러주세요)</span>",
        placeholder: "추가로 원하시는 옵션을 직접 입력하셔도 됩니다",
        multiSelect: true,
        chips: ["풀옵션(세탁기/냉장고/에어컨)", "건조기", "엘리베이터", "베란다/테라스", "보안/CCTV", "신축급", "특이사항 없음"]
      },
      {
        key: "priority",
        label: "중요시 보는 부분",
        question: "<b>집 구하실 때 가장 중요시 보는 부분</b>은 무엇인가요? 👀",
        placeholder: "예: 채광, 수압, 층간소음, 가성비 등",
        chips: ["채광 / 남향", "조용한 주변환경", "역세권 / 교통편의", "수압 / 깔끔한 컨디션", "가성비 (금액)"]
      },
      {
        key: "viewingDate",
        label: "방 보실 수 있는 날짜",
        question: "실제로 <b>방 보실 수 있는 날짜와 시간대</b>는 언제인가요? 🗓️",
        placeholder: "예: 이번 주 토요일 오후 2시, 평일 저녁 7시 이후",
        chips: ["이번 주 평일", "이번 주 주말", "언제든 가능 (시간 협의)"]
      }
    ];

    // ================= 내장 브라우저(카톡/인스타 안) 감지 =================
    const UA = navigator.userAgent;
    const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const IN_KAKAO = /KAKAOTALK/i.test(UA);
    const IN_APP = IN_KAKAO || /Instagram|FBAN|FBAV|NAVER|Line\/|DaumApps/i.test(UA);
    // 아이폰 내장 브라우저에서만 안내 (입력 전에 미리 알려야 입력 내용이 안 날아감)
    function buildInAppNotice() {
      if (!(IS_IOS && IN_APP)) return "";
      const href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href.split("#")[0]);
      return `\n\n<div class='mt-2 rounded-xl bg-amber-50 border border-amber-200 p-2.5 text-xs text-amber-800 leading-snug break-keep'><b>⚠️ 먼저 확인해 주세요!</b><br/>지금 카톡/인스타 안에서 열려 있어요. 이 상태로는 마지막에 앱 이동·복사가 안 될 수 있고, 나중에 다시 열면 입력한 내용이 사라져요.<br/>${IN_KAKAO ? `<a href='${href}' class='mt-2 block text-center py-2 rounded-lg bg-amber-500 text-white font-extrabold'>기본 브라우저(Safari)로 다시 열기</a>` : "<b>화면 아래(또는 위)의 ⋯ → 'Safari로 열기'</b>를 눌러 다시 열어주세요."}</div>`;
    }

    // ================= 상태 관리 =================
    let currentStepIdx = -1;
    let answers = {};
    let selectedMultiOptions = [];
    let isCompleted = false;
    let editReturn = false;

    // 평소에는 CSS(100dvh)로 화면을 꽉 채우고, 키보드가 올라와 화면이 줄어들 때만 그 높이에 맞춤
    function fitViewport() {
      const vv = window.visualViewport;
      const keyboardOpen = vv && (window.innerHeight - vv.height) > 120;
      if (keyboardOpen) {
        document.documentElement.style.setProperty("--app-h", Math.round(vv.height) + "px");
      } else {
        document.documentElement.style.removeProperty("--app-h"); // 다시 100dvh로 (전체 화면)
      }
      window.scrollTo(0, 0);
    }
    window.addEventListener("resize", fitViewport);
    window.addEventListener("orientationchange", () => setTimeout(fitViewport, 200));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => { fitViewport(); scrollToBottom(); });
    }

    document.addEventListener("DOMContentLoaded", () => {
      fitViewport();
      startGreeting();
    });

    function scrollToBottom() {
      const area = document.getElementById("chatScrollArea");
      if (!area) return;
      requestAnimationFrame(() => {
        area.scrollTop = area.scrollHeight;
      });
      setTimeout(() => {
        area.scrollTo({ top: area.scrollHeight, behavior: "smooth" });
      }, 100);
    }

    function updateProgress() {
      const total = STEPS.length;
      const done = isCompleted ? total : Math.max(0, currentStepIdx);
      const pct = Math.round((done / total) * 100);

      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("progressCount").textContent = `${done} / ${total}`;
      document.getElementById("progressLabel").textContent = isCompleted
        ? "모든 조건 접수 완료!"
        : currentStepIdx < 0
          ? "맞춤 매물 조건 접수 준비"
          : `${(STEPS[currentStepIdx] || {}).label || ""} 입력 중`;

      const prevBtn = document.getElementById("prevStepBtn");
      if (currentStepIdx > 0 && !isCompleted) {
        prevBtn.classList.remove("hidden");
      } else {
        prevBtn.classList.add("hidden");
      }
    }

    // ================= 말풍선 렌더링 =================
    function appendBotMessage(htmlContent, delay = 220) {
      return new Promise((resolve) => {
        const container = document.getElementById("chatContainer");

        const typingId = `typing_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
        const typingEl = document.createElement("div");
        typingEl.id = typingId;
        typingEl.className = "flex items-end gap-2.5 msg-anim";
        typingEl.innerHTML = `
          <div class="w-8 h-8 rounded-2xl bg-[#0284C7] text-white flex items-center justify-center shrink-0 shadow-sm text-sm">
            <i class="ph-fill ph-paw-print"></i>
          </div>
          <div class="bg-white border border-sky-100 px-4 py-3 rounded-2xl rounded-bl-md shadow-sm flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 typing-dot"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 typing-dot"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400 typing-dot"></span>
          </div>
        `;
        container.appendChild(typingEl);
        scrollToBottom();

        setTimeout(() => {
          const t = document.getElementById(typingId);
          if (t) t.remove();

          const msgEl = document.createElement("div");
          msgEl.className = "flex items-start gap-2.5 msg-anim";
          msgEl.innerHTML = `
            <div class="w-8 h-8 rounded-2xl bg-[#0284C7] text-white flex items-center justify-center shrink-0 shadow-sm mt-0.5 text-sm">
              <i class="ph-fill ph-paw-print"></i>
            </div>
            <div class="max-w-[calc(100%-2.75rem)] min-w-0 space-y-1">
              <div class="text-[11px] font-bold text-slate-500 ml-1">와방 매니저</div>
              <div class="bg-white border border-sky-100 text-slate-800 text-sm px-4 py-3 rounded-2xl rounded-tl-md shadow-sm leading-relaxed whitespace-pre-line break-words">${htmlContent}</div>
            </div>
          `;
          container.appendChild(msgEl);
          scrollToBottom();
          resolve(msgEl);
        }, delay);
      });
    }

    function appendUserMessage(text, stepIdxToEdit = null) {
      const container = document.getElementById("chatContainer");
      const msgEl = document.createElement("div");
      msgEl.className = "flex justify-end msg-anim";
      msgEl.innerHTML = `
        <div class="max-w-[88%] min-w-0 flex flex-col items-end gap-1">
          <div class="bg-[#0284C7] text-white text-sm font-medium px-4 py-2.5 rounded-2xl rounded-tr-md shadow-sm leading-relaxed break-keep break-words">${escapeHtml(text)}</div>
          ${stepIdxToEdit !== null ? `<button type="button" onclick="editFromStep(${stepIdxToEdit})" class="text-[11px] text-slate-400 hover:text-[#0284C7] underline pr-1">수정하기</button>` : ""}
        </div>
      `;
      container.appendChild(msgEl);
      scrollToBottom();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // ================= 챗봇 대화 흐름 제어 =================
    async function startGreeting() {
      currentStepIdx = -1;
      answers = {};
      selectedMultiOptions = [];
      isCompleted = false;
      editReturn = false;
      document.getElementById("chatContainer").innerHTML = "";
      document.getElementById("inputArea").classList.remove("hidden");
      hideAfterSendModal();
      const hl = document.getElementById("headerListingLink");
      if (hl) hl.href = CONFIG.LISTING_SITE_URL;
      updateProgress();

      await appendBotMessage(
        "안녕하세요! <b>와방 · 공인중개사 이하늘</b> 자동 매물 접수 챗봇입니다. 🏡\n\n원하시는 집 조건을 1분 만에 간단히 알려주시면, 조건에 딱 맞는 실매물을 찾아 빠르게 안내해 드릴게요!" + buildInAppNotice(),
        220
      );

      renderQuickChips(["네, 시작할게요! 🐾"], false);
      document.getElementById("userInput").placeholder = "'네, 시작할게요!' 버튼을 눌러주세요";
    }

    function restartChat() {
      startGreeting();
    }

    async function goToStep(idx) {
      currentStepIdx = idx;
      selectedMultiOptions = [];

      // 마지막 질문 다음이면 진행률 갱신 전에 바로 완료 처리 (STEPS[12]가 없어서 에러 나던 부분)
      if (idx >= STEPS.length) {
        await finishConversation();
        return;
      }
      updateProgress();

      const step = STEPS[idx];
      document.getElementById("userInput").value = "";
      document.getElementById("userInput").placeholder = step.placeholder || "답변을 입력해 주세요...";
      renderQuickChips(step.chips || [], !!step.multiSelect);

      await appendBotMessage(step.question, 220);
    }

    function goPrevStep() {
      if (currentStepIdx > 0 && !isCompleted) {
        appendUserMessage("이전 질문으로 돌아갈게요");
        goToStep(currentStepIdx - 1);
      }
    }

    function editFromStep(stepIdx) {
      editReturn = true;
      isCompleted = false;
      document.getElementById("inputArea").classList.remove("hidden");
      appendUserMessage(`'${STEPS[stepIdx].label}' 항목을 다시 입력할게요`);
      goToStep(stepIdx);
    }

    // ================= 빠른 선택 칩 & 입력 처리 =================
    function renderQuickChips(chips, isMulti) {
      const wrap = document.getElementById("quickChipsContainer");
      const multiBar = document.getElementById("multiSelectBar");

      if (!isMulti) {
        multiBar.classList.add("hidden");
        wrap.innerHTML = chips.map(chip => `
          <button type="button" onclick="handleChipClick('${chip.replace(/'/g, "\\'")}')"
            class="px-3.5 py-2 rounded-full bg-sky-50 hover:bg-[#0284C7] text-[#0284C7] hover:text-white border border-sky-200 text-xs font-bold transition max-w-full text-left leading-snug">
            ${chip}
          </button>
        `).join("");
      } else {
        multiBar.classList.remove("hidden");
        updateMultiBarText();
        wrap.innerHTML = chips.map(chip => {
          const active = selectedMultiOptions.includes(chip);
          return `
            <button type="button" onclick="toggleMultiChip('${chip.replace(/'/g, "\\'")}')"
              class="px-3.5 py-2 rounded-full text-xs font-bold border transition max-w-full text-left leading-snug ${
                active
                  ? "bg-[#0284C7] text-white border-[#0284C7] shadow-sm"
                  : "bg-sky-50 text-[#0284C7] border-sky-200 hover:bg-sky-100"
              }">
              ${active ? "✓ " : "+ "}${chip}
            </button>
          `;
        }).join("");
      }
    }

    function toggleMultiChip(chip) {
      if (chip === "특이사항 없음") {
        selectedMultiOptions = ["특이사항 없음"];
      } else {
        selectedMultiOptions = selectedMultiOptions.filter(c => c !== "특이사항 없음");
        const idx = selectedMultiOptions.indexOf(chip);
        if (idx >= 0) selectedMultiOptions.splice(idx, 1);
        else selectedMultiOptions.push(chip);
      }
      const step = STEPS[currentStepIdx];
      renderQuickChips(step.chips || [], true);
    }

    function updateMultiBarText() {
      document.getElementById("multiSelectCount").textContent = `${selectedMultiOptions.length}개 선택됨`;
    }

    function confirmMultiSelect() {
      const customVal = document.getElementById("userInput").value.trim();
      const combined = [...selectedMultiOptions];
      if (customVal) combined.push(customVal);

      const finalAnswer = combined.length > 0 ? combined.join(", ") : "특이사항 없음";
      submitAnswer(finalAnswer);
    }

    function handleChipClick(value) {
      if (currentStepIdx === -1) {
        appendUserMessage(value);
        goToStep(0);
        return;
      }
      submitAnswer(value);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const inputEl = document.getElementById("userInput");
      const val = inputEl.value.trim();

      if (currentStepIdx === -1) {
        appendUserMessage(val || "네, 시작할게요! 🐾");
        inputEl.value = "";
        goToStep(0);
        return;
      }

      const step = STEPS[currentStepIdx];
      if (step && step.multiSelect) {
        confirmMultiSelect();
        return;
      }

      if (!val) return;
      submitAnswer(val);
    }

    function submitAnswer(value) {
      const step = STEPS[currentStepIdx];
      if (!step) return;
      answers[step.key] = value;
      document.getElementById("userInput").value = "";
      appendUserMessage(value, currentStepIdx);
      if (editReturn) {
        editReturn = false;
        const next = STEPS.findIndex(st => !answers[st.key]);
        goToStep(next === -1 ? STEPS.length : next);
        return;
      }
      goToStep(currentStepIdx + 1);
    }

    // ================= 완료 요약 카드 생성 및 전송 액션 =================
    function buildFormattedSummaryText() {
      return [
        "[와방 · 맞춤 매물 문의 접수]",
        `• 구조: ${answers.structure || "-"}`,
        `• 입주예정일: ${answers.moveInDate || "-"}`,
        `• 보증금: ${answers.deposit || "-"}`,
        `• 월세: ${answers.monthlyRent || "-"}`,
        `• 관리비(포함/별도): ${answers.adminFee || "-"}`,
        `• 찾으시는 위치: ${answers.location || "-"}`,
        `• 주차 여부: ${answers.parking || "-"}`,
        `• 반려동물 여부: ${answers.pet || "-"}`,
        `• 원하시는 옵션: ${answers.options || "-"}`,
        `• 중요시 보는 부분: ${answers.priority || "-"}`,
        `• 방 보실 수 있는 날짜: ${answers.viewingDate || "-"}`
      ].join("\n");
    }

    // 챗봇 답변을 매물 사이트 주소에 담아서 넘김 → 매물 사이트가 조건을 자동으로 필터에 적용
    function buildListingHref() {
      const base = CONFIG.LISTING_SITE_URL;
      return base + (base.includes("?") ? "&" : "?") + "chat=" + encodeURIComponent(JSON.stringify(answers));
    }

    async function finishConversation(delay = 250) {
      isCompleted = true;
      updateProgress();
      document.getElementById("inputArea").classList.add("hidden");

      const oldCard = document.getElementById("summaryCard");
      const again = !!oldCard;
      if (oldCard) oldCard.remove();

      const thanksEl = await appendBotMessage(
        again
          ? "수정하신 내용으로 다시 정리했어요! 아래 버튼으로 문의를 보내주세요. ✅"
          : "감사합니다! 알려주신 희망 조건이 모두 정리되었습니다. 🎉\n\n아래 <b>'내 조건에 맞는 매물 보기'</b>를 누르시면 조건에 맞는 매물만 골라서 보여드려요. 마음에 드는 매물을 <b>♡ 담기</b> 하신 뒤 바로 중개사에게 보내주세요!\n\n<span class='text-xs text-slate-500'>매물 보기 전에 조건만 먼저 보내셔도 돼요 (아래 카카오톡·인스타 버튼).</span>",
        delay
      );
      const listingHref = buildListingHref();
      const headerLink = document.getElementById("headerListingLink");
      if (headerLink) headerLink.href = listingHref;

      const summaryText = buildFormattedSummaryText();
      const phone = (CONFIG.PHONE || "").trim();
      const isIOS = IS_IOS;
      const canShare = typeof navigator.share === "function";
      // 아이폰: target="_blank"로 새 탭을 열면 앱 전환 후 빈(흰색) 탭이 남아서 현재 탭에서 바로 이동
      const linkAttrs = isIOS ? "" : 'target="_blank" rel="noopener noreferrer"';
      const isMobile = isIOS || /Android/i.test(navigator.userAgent);
      const instaHref = isMobile ? CONFIG.INSTAGRAM_DM_URL : CONFIG.INSTAGRAM_WEB_URL;
      const smsSeparator = isIOS ? "&" : "?";
      const smsHref = `sms:${phone}${smsSeparator}body=${encodeURIComponent(summaryText)}`;

      const container = document.getElementById("chatContainer");
      const cardEl = document.createElement("div");
      cardEl.id = "summaryCard";
      cardEl.className = "msg-anim bg-white rounded-3xl border border-sky-200 shadow-md overflow-hidden";
      cardEl.innerHTML = `
        <div class="bg-gradient-to-r from-[#0284C7] to-sky-500 px-4 py-3.5 text-white flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 font-extrabold text-sm min-w-0">
            <i class="ph-fill ph-clipboard-text text-lg shrink-0"></i>
            <span class="leading-snug break-keep">접수된 희망 조건</span>
          </div>
          <button type="button" onclick="restartChat()" class="text-[11px] bg-white/20 hover:bg-white/30 px-2.5 py-1 rounded-full font-bold transition whitespace-nowrap shrink-0">
            처음부터 다시
          </button>
        </div>

        <div class="p-3 min-[380px]:p-4 space-y-3">
          <pre id="summaryPre" class="text-xs text-slate-700 bg-sky-50/80 p-3.5 rounded-2xl border border-sky-100 whitespace-pre-wrap break-words font-sans leading-relaxed select-all">${escapeHtml(summaryText)}</pre>

          <!-- 복사 실패 시에만 나타나는 대체 방법 안내 -->
          <div id="copyFail" class="hidden rounded-2xl bg-rose-50 border border-rose-200 p-3 text-[11px] leading-relaxed text-rose-800 break-keep">
            <b>자동 복사가 안 됐어요. 아래 방법 중 하나를 써주세요.</b><br/>
            ① 위 요약 박스를 <b>길게 눌러 → '복사'</b> (이미 전체가 선택되어 있어요)<br/>
            ${canShare ? `② <button type="button" onclick="shareInquiry()" class="underline font-extrabold">공유 메뉴 열기</button> → <b>'복사'</b> 선택<br/>` : ""}
            ${canShare ? "③" : "②"} 아래 <b>문자(SMS) 전송</b> 버튼 (내용이 문자창에 자동으로 채워져요)
          </div>

          <!-- ★ 메인: 조건을 담아 매물 사이트로 이동 -->
          <a href="${escapeHtml(listingHref)}"
            class="w-full px-3 py-4 leading-snug text-center rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-extrabold text-[15px] shadow-md flex items-center justify-center gap-2 transition">
            <i class="ph-fill ph-house-line text-xl shrink-0 text-sky-300"></i>
            <span class="break-keep">내 조건에 맞는 매물 보기</span>
            <i class="ph-bold ph-arrow-right shrink-0"></i>
          </a>
          <p class="text-[11px] text-slate-500 text-center leading-snug break-keep -mt-1">매물을 고르고 <b>♡ 담기</b> → <b>중개사에게 보내기</b>를 누르면<br/>위 조건과 함께 바로 전달돼요</p>

          <div class="flex items-center gap-2 pt-1">
            <div class="flex-1 h-px bg-slate-200"></div>
            <span class="text-[11px] font-bold text-slate-400">또는 조건만 먼저 보내기</span>
            <div class="flex-1 h-px bg-slate-200"></div>
          </div>

          <div class="space-y-2.5 pt-1">
            ${isIOS ? `<!-- 아이폰: ① 복사를 먼저 확실히 확인 -->
            <button type="button" id="copyBtn" onclick="copyInquiry()"
              class="w-full px-3 py-3.5 leading-snug text-center rounded-2xl bg-[#0284C7] hover:bg-sky-700 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition">
              <i class="ph-bold ph-copy text-lg shrink-0"></i>
              <span id="copyBtnText" class="break-keep">① 문의 내용 복사하기</span>

            <p class="text-[11px] font-bold text-slate-500 text-center">② 복사 후, 보낼 곳을 눌러 <b>붙여넣기</b> 해주세요</p>` : ""}
            <!-- 누르면 문의 내용이 자동 복사되고 바로 이동 -->
            <a href="${CONFIG.KAKAO_OPENCHAT_URL}" ${linkAttrs}
              onclick="handleChannelLinkClick('kakao')"
              class="w-full px-3 py-3.5 leading-snug text-center rounded-2xl bg-[#FEE500] hover:brightness-95 active:scale-[0.99] text-[#191919] font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition">
              <i class="ph-fill ph-chat-teardrop-text text-lg shrink-0"></i>
              <span class="break-keep">💬 오픈카카오톡으로 문의 보내기</span>
            </a>

            <a href="${instaHref}" ${linkAttrs}
              onclick="handleChannelLinkClick('insta')"
              class="w-full px-3 py-3.5 leading-snug text-center rounded-2xl bg-gradient-to-r from-purple-600 via-pink-500 to-amber-500 hover:brightness-95 active:scale-[0.99] text-white font-extrabold text-sm shadow-sm flex items-center justify-center gap-2 transition">
              <i class="ph-fill ph-instagram-logo text-lg shrink-0"></i>
              <span class="break-keep">📩 인스타그램으로 문의 보내기</span>
            </a>
            ${isIOS ? `<p class="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-2 text-center leading-snug break-keep">📱 붙여넣을 때 <b>'붙여넣기 허용'</b> 창이 뜨면 꼭 <b>허용</b>을 눌러주세요. 그래도 내용이 안 나오면 아래 <b>'문자(SMS) 전송'</b>을 쓰시면 내용이 자동으로 채워져요.</p>` : ""}
            <p class="text-[11px] text-slate-400 text-center leading-snug break-keep">${isIOS ? "" : "누르면 문의 내용이 자동 복사돼요. "}인스타그램은 프로필이 열리면 <b>'메시지'</b> 버튼을 눌러 붙여넣어 주세요.<br/>앱이 안 열리면 아래 <b>'내용만 복사하기'</b>를 누른 뒤 앱을 직접 열어 붙여넣어도 돼요.</p>

            <!-- 3. 보조 버튼: 내용만 복사 / 문자 전송 -->
            <div class="grid grid-cols-2 gap-2 pt-0.5">
              <button type="button" onclick="copyOnlyAndAskNext()"
                class="px-2 py-3 rounded-2xl bg-sky-50 hover:bg-sky-100 text-[#0284C7] border border-sky-200 font-bold text-xs leading-tight flex items-center justify-center gap-1.5 transition">
                <i class="ph-bold ph-copy text-sm shrink-0"></i>
                <span>내용만 복사하기</span>
              </button>

              <a href="${smsHref}" onclick="setTimeout(() => showAfterSendModal('문자 앱으로 연결되었습니다!', '문자 앱에서 내용을 확인하고 전송해 주세요.'), 400)"
                class="px-2 py-3 rounded-2xl bg-sky-50 hover:bg-sky-100 text-[#0284C7] border border-sky-200 font-bold text-xs leading-tight flex items-center justify-center gap-1.5 transition">
                <i class="ph-bold ph-chat-circle-dots text-sm shrink-0"></i>
                <span>문자(SMS) 전송</span>
              </a>
            </div>
          </div>

          <!-- 하단 바로가기 액션 -->
          <div class="pt-3 mt-2 border-t border-slate-100 flex items-center justify-between gap-2">
            <a href="${escapeHtml(listingHref)}"
              class="flex-1 py-2.5 rounded-xl bg-[#0284C7] hover:bg-sky-700 text-white text-xs font-extrabold flex items-center justify-center gap-1 transition">
              <i class="ph-fill ph-house-line"></i>
              <span>내 조건 매물 보러가기</span>
            </a>
          </div>
        </div>
      `;

      container.appendChild(cardEl);

      // 요약 카드 맨 아래가 아니라, 위의 '감사합니다!' 안내 문구가 화면 맨 위에 보이도록 스크롤
      setTimeout(() => {
        const area = document.getElementById("chatScrollArea");
        if (!area || !thanksEl) return;
        const gap = thanksEl.getBoundingClientRect().top - area.getBoundingClientRect().top;
        area.scrollTo({ top: area.scrollTop + gap - 8, behavior: "smooth" });
      }, 200);
    }

    // ================= 클립보드 복사 & 채널 연결 로직 =================
    // 동기 복사: 터치 직후 바로 실행해야 아이폰이 허용함. execCommand 결과를 그대로 반환(거짓 성공 없음)
    function legacyCopy(text) {
      let ok = false;
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("inputmode", "none");   // 키보드가 올라오지 않게
        ta.contentEditable = "true";
        ta.readOnly = false;
        ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;";
        document.body.appendChild(ta);
        const range = document.createRange();
        range.selectNodeContents(ta);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        ta.focus({ preventScroll: true });
        ta.setSelectionRange(0, text.length);
        ok = document.execCommand("copy");
        sel.removeAllRanges();
        document.body.removeChild(ta);
      } catch (err) { ok = false; }
      return ok;
    }

    // 링크 버튼용(페이지가 바로 넘어가므로 기다릴 수 없음): 동기 복사 결과만 신뢰, 최신 방식은 보조로 같이 호출
    function copyTextToClipboard(text) {
      const ok = legacyCopy(text);
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => {});
      } catch (err) {}
      return ok;
    }

    // 복사 버튼용: 실제 성공/실패를 확인해서 반환
    async function copyTextVerified(text) {
      if (copyTextToClipboard(text)) return true;           // 1) 동기 방식 (터치 직후라 가장 확실)
      try {                                                  // 2) 최신 방식으로 재시도하고 결과 확인
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) { return false; }
    }

    // 복사 실패 시: 대체 방법 안내 + 요약 박스 전체 선택
    function showCopyFallback() {
      const box = document.getElementById("copyFail");
      if (box) box.classList.remove("hidden");
      try {
        const pre = document.getElementById("summaryPre");
        const r = document.createRange(); r.selectNodeContents(pre);
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        if (box) box.scrollIntoView({ block: "center", behavior: "smooth" });
      } catch (err) {}
    }

    // 공유 메뉴(아이폰 기본 기능): 메뉴 안의 '복사'를 누르면 확실히 복사됨
    async function shareInquiry() {
      try { await navigator.share({ text: buildFormattedSummaryText() }); } catch (err) {}
    }

    // 아이폰용 ① 복사 버튼
    async function copyInquiry() {
      const ok = await copyTextVerified(buildFormattedSummaryText());
      const btn = document.getElementById("copyBtn");
      const txt = document.getElementById("copyBtnText");
      const fail = document.getElementById("copyFail");
      if (ok) {
        if (fail) fail.classList.add("hidden");
        if (btn && txt) {
          txt.textContent = "✓ 복사 완료! 아래에서 보낼 곳을 눌러주세요";
          btn.classList.remove("bg-[#0284C7]", "hover:bg-sky-700");
          btn.classList.add("bg-emerald-600", "hover:bg-emerald-700");
        }
        showToast("문의 내용이 복사되었습니다! 이제 카톡/인스타에 붙여넣어 주세요.");
      } else {
        if (txt) txt.textContent = "① 문의 내용 복사하기";
        showToast("자동 복사가 안 됐어요. 아래 안내를 따라 복사해 주세요.");
        showCopyFallback();
      }
    }

    function handleChannelLinkClick(channel) {
      const ok = copyTextToClipboard(buildFormattedSummaryText());
      const isInsta = channel === "insta";
      showToast(
        ok
          ? (isInsta ? "문의 내용이 복사되었습니다! 프로필에서 '메시지'를 눌러 붙여넣기 해주세요."
                     : "문의 내용이 복사되었습니다! 오픈카카오톡에 붙여넣기 해주세요.")
          : "자동 복사가 안 됐을 수 있어요. 돌아와서 복사 방법을 확인해 주세요."
      );
      let desc = null;
      if (!ok) { desc = "자동 복사가 되지 않았을 수 있어요. 이 화면으로 돌아와 '내용만 복사하기'를 누르거나 요약 박스를 길게 눌러 복사한 뒤 붙여넣어 주세요."; showCopyFallback(); }
      else if (isInsta) desc = "인스타그램 프로필이 열리면 '메시지' 버튼을 눌러 DM 창에 붙여넣기(길게 누르기 → 붙여넣기) 후 전송해 주세요.";
      setTimeout(() => showAfterSendModal(ok ? "문의 내용이 복사되었습니다!" : "복사를 확인해 주세요", desc), 300);
    }

    async function copyOnlyAndAskNext() {
      const ok = await copyTextVerified(buildFormattedSummaryText());
      if (ok) {
        showToast("문의 내용이 복사되었습니다!");
        showAfterSendModal("문의 내용이 복사되었습니다!");
      } else {
        showToast("자동 복사가 안 됐어요. 아래 안내를 따라 복사해 주세요.");
        showCopyFallback();
      }
    }

    // ================= 후속 행동 모달 =================
    const DEFAULT_MODAL_DESC = '열린 채팅창에 <b>붙여넣기(길게 누르기 → 붙여넣기)</b> 후 전송해 주세요.<br/>전송을 마치셨다면 아래에서 다음 단계를 선택해 주세요!';

    function showAfterSendModal(titleText, descText) {
      const modal = document.getElementById("afterSendModal");
      document.getElementById("modalTitle").textContent = titleText || "문의 내용이 복사되었습니다!";
      document.getElementById("modalDesc").innerHTML = descText ? escapeHtml(descText) : DEFAULT_MODAL_DESC;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function hideAfterSendModal() {
      const modal = document.getElementById("afterSendModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }


    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastText").textContent = msg;
      toast.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add("hidden");
      }, 3500);
    }
  </script>
</body>
</html>
